name: Remote Access macOS Runner

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Connect to Tailscale using your Auth Key
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Configure macOS user password for remote authentication
      - name: Configure macOS Screen Sharing Access
        run: |
          # Define a secure password for the 'runner' account
          PASSWORD="MySecurePassword123"
          
          echo "Setting up password for the runner account..."
          sudo dscl . -passwd /Users/runner "$PASSWORD"
          
          # Fetch the Tailscale assigned IPv4 address
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # 3. Print Connection Summary and Keep Alive Loop
      - name: Maintain Connection
        run: |
          echo ""
          echo "=== REMOTE DESKTOP / VNC ACCESS ==="
          echo "Address:  ${{ env.TAILSCALE_IP }}"
          echo "Username: runner"
          echo "Password: ${{ env.PASSWORD }}"
          echo "==================================="
          echo ""
          echo "Connecting from a Mac? Press Cmd+K in Finder and enter: vnc://${{ env.TAILSCALE_IP }}"
          echo "Connecting from Windows? Use a VNC client (like TightVNC) and connect to: ${{ env.TAILSCALE_IP }}"
          echo ""
          
          while true; do
            echo "[$(date)] VNC Connection Active - Cancel workflow run in GitHub to terminate."
            sleep 300
          done
