name: Remote Access macOS Runner

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Connect to Tailscale Network using your existing Auth Key
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Extract Network Interface Mapping and Keep Active Loop
      - name: Maintain Connection
        run: |
          # Fetch the active Tailscale IP mapping
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "=== PORTABLE MAC OS TERMINAL INTERFACE ==="
          echo "Address:  $TS_IP"
          echo "Username: runner"
          echo "=========================================="
          echo ""
          echo "To interact with this macOS environment securely over your Tailscale Mesh network:"
          echo "Open your local terminal and connect via SSH directly:"
          echo "ssh runner@$TS_IP"
          echo ""
          
          while true; do
            echo "[$(date)] Remote secure shell mapping active over Tailscale IP..."
            sleep 300
          done
