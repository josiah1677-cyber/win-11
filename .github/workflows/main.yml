name: Remote Access macOS Runner

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Connect to Tailscale Network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Configure Local User Credentials
      - name: Configure macOS User Password
        run: |
          PASSWORD="MySecurePassword123"
          echo "Setting up password for the runner account..."
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetUserPassword runner -password "$PASSWORD"
          
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # 3. Force-Enable Apple Remote Management & VNC Server
      - name: Turn On VNC Server Service
        run: |
          echo "Activating macOS Screen Sharing Engine..."
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          
          # Allow control access and configure general permissions
          sudo $KICKSTART -configure -allowAccessFor -allUsers -privs -all
          
          # Enable legacy third-party VNC client support and hardcode the VNC auth password
          sudo $KICKSTART -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo $KICKSTART -configure -clientopts -setvncpw -vncpw "${{ env.PASSWORD }}"
          
          # Force start the network listener agent
          sudo $KICKSTART -activate
          sudo $KICKSTART -restart -agent -console

      # 4. Print Connection Summary and Keep Alive Loop
      - name: Maintain Connection
        run: |
          echo ""
          echo "=== REMOTE DESKTOP / VNC ACCESS ==="
          echo "Address:  ${{ env.TAILSCALE_IP }}"
          echo "Username: runner"
          echo "Password: ${{ env.PASSWORD }}"
          echo "==================================="
          echo ""
          echo "Connecting from a Mac? Press Cmd+K in Finder and enter: vnc://${{ env.TAILSCALE_IP }}"
          echo "Connecting from Windows? Use a VNC client (like TightVNC) and connect to: ${{ env.TAILSCALE_IP }}"
          echo ""
          
          while true; do
            echo "[$(date)] VNC Connection Active - Cancel workflow run in GitHub to terminate."
            sleep 300
          done
