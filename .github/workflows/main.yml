name: Remote Access macOS Runner

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Connect to Tailscale Network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Create a fresh User and configure the Apple Screen Sharing engine
      - name: Configure Clean VNC Profile Access
        run: |
          # Define a fixed 8-character password for structural compatibility
          PASSWORD="MacVNC12"
          
          echo "Creating an isolated desktop user for your connection..."
          # Creates a secondary clean administrator profile 
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "$PASSWORD" -admin
          
          echo "Activating macOS Screen Sharing Engine..."
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          
          # Force remote configurations to authorize the new account
          sudo $KICKSTART -configure -allowAccessFor -allUsers -privs -all
          sudo $KICKSTART -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo $KICKSTART -configure -clientopts -setvncpw -vncpw "$PASSWORD"
          
          # Fire up system service agents
          sudo $KICKSTART -activate
          sudo $KICKSTART -restart -agent -console
          
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # 3. Print Connection Summary and Keep Alive Loop
      - name: Maintain Connection
        run: |
          echo ""
          echo "=== REMOTE DESKTOP / VNC ACCESS ==="
          echo "Address:  ${{ env.TAILSCALE_IP }}"
          echo "Username: vncuser"
          echo "Password: ${{ env.PASSWORD }}"
          echo "==================================="
          echo ""
          echo "Connecting from a Mac? Press Cmd+K in Finder and enter: vnc://${{ env.TAILSCALE_IP }}"
          echo "Connecting from Windows? Use a VNC client (like TightVNC) and connect to: ${{ env.TAILSCALE_IP }}"
          echo ""
          
          while true; do
            echo "[$(date)] Secure VNC Session Open - Cancel workflow run in GitHub to close."
            sleep 300
          done
