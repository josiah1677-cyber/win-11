name: Headless macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Connect to Tailscale Network using your existing Auth Key
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 2. Build independent virtual video frame buffers & x11vnc servers
      - name: Build Headless Video Frame Server
        run: |
          echo "Updating Homebrew dependencies..."
          brew update --preinstall
          
          echo "Installing independent display servers..."
          brew install x11vnc xdotool
          
          # Assign custom fixed password token for security compliance
          PASSWORD="MacVNC12"
          mkdir -p ~/.vnc
          x11vnc -storepasswd "$PASSWORD" ~/.vnc/passwd
          
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV

      # 3. Initialize background pipeline listeners & retain the active task 
      - name: Maintain Connection
        run: |
          echo ""
          echo "=== PORTABLE MAC OS GRAPHICS INTERFACE ==="
          echo "Address:  ${{ env.TAILSCALE_IP }}:5900"
          echo "Password: ${{ env.PASSWORD }}"
          echo "=========================================="
          echo ""
          echo "Connecting from Mac? Launch Terminal, run: open vnc://${{ env.TAILSCALE_IP }}:5900"
          echo "Connecting from Windows? Connect using RealVNC Viewer to: ${{ env.TAILSCALE_IP }}:5900"
          echo ""
          
          # Launch background system display stream maps 
          x11vnc -rfbauth ~/.vnc/passwd -rfbport 5900 -shared -forever -bg
          
          while true; do
            echo "[$(date)] Custom macOS Display Listening on Port 5900..."
            sleep 300
          done
